<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabelas</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    table {
      width: 400px;
      border-collapse: collapse;
    }

    td,th {
      border: 1px solid black;
      padding: 10px;
    }

    caption {
      font-size: 1.5em;
      font-weight: bold;
      padding: 10px;
      background-color: lightgray;
    }

    thead, tfoot {
      background-color: gray;
      color: white;
    }

     .num {
      text-align: right;
    }
  </style>
</head>
<body>
  <h1>Uso de tabelas grandes</h1>
  <!--
  ANATOMIA PARA TABELAS GRANDES
    TABLE
      CAPTION = Título da tabela
      THEAD
        TR, TD, TH
      TBODY
        TR, TD, TH
      TFOOT
        TR, TD, TH
  -->
        <table>
          <caption>População das Unidades da Federativas</caption>
          <thead>
            <tr>
              <th scope="col">Estado</th>
              <th scope="col" style="width: 50px;">População</th>
            </tr>
          </thead>
          <tfoot>
            <tr>
              <th scope="row">Total de Habitantes</th>
              <th class="num">210,147.125</th>
            </tr>
          </tfoot>
          <tbody>
            <tr>
              <td>São Paulo</td>
              <td class="num">45,919.049</td>
            </tr>
            <tr>
              <td>Minas Gerais</td>
              <td class="num">21,292.666</td>
            </tr>
            <tr>
              <td>Rio de Janeiro</td>
              <td class="num">13,290.000</td> 
            </tr>
            <tr>
              <td>Bahia</td>
              <td class="num">14,873.943</td>
            </tr>
            <tr>
              <td>Paraná</td>
              <td class="num">11,433.957</td> 
            </tr>
            <tr>
              <td>Rio Grande do Sul</td>
              <td class="num">11,377.239</td>
            </tr>
            <tr>
              <td>Pernambuco</td>
              <td class="num">9,557.071</td> 
            </tr>
          </tbody>
        </table>
</body>
</html>
